plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.swyomsanjog.dayflow'
version = '1.0.0'

android {
  namespace "expo.modules.dayflowdevice"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Periodic background step-counter readings (about every 15 minutes).
  implementation "androidx.work:work-runtime:2.9.1"
}
